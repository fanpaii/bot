[AdminWhitelist]
enable = true
command-format = """⚙️管理白名单

➕添加白名单：
- 添加白名单 / 加白 - 添加当前群聊到白名单
- 添加白名单 @用户 - 添加被@的用户到白名单
- 添加白名单 ID - 添加指定ID到白名单

➖移除白名单：
- 移除白名单 / 移白 - 移除当前群聊/用户
- 移除白名单 @用户 - 移除被@的用户
- 移除白名单 ID - 移除指定ID

📋查看白名单列表：
- 白名单列表 / 群白名单列表

📝说明：
1. 群ID格式通常为：xxxxx@chatroom
2. 需要设置ignore-mode=Whitelist才能生效
3. 只有管理员能使用此命令
4. 白名单命令只能在群聊中使用"""